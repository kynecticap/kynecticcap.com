<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kynectic Capital — Invest with Clarity. Thrive with Momentum.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-0: #0a000f;
  --bg-1: #160020;
  --bg-2: #2a0040;
  --purple: #B003BE;
  --deep: #7f0289;
  --gold: #e5c158;
  --gold-deep: #b8923a;
  --gold-light: #f5d676;
  --ink: #f4ecff;
  --ink-soft: #cdb8e4;
  --ink-mute: #9a86b8;
  --line: rgba(229, 193, 88, 0.18);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-bg-strong: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.10);
  --glass-blur: 18px;
  --display-font: 'Cormorant Garamond', serif;
  --sans: 'Manrope', system-ui, sans-serif;
  --max: 1280px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

.serif { font-family: var(--display-font); font-weight: 500; letter-spacing: -0.01em; }
.gold-shimmer {
  background: linear-gradient(110deg, var(--gold-deep) 0%, var(--gold-light) 35%, var(--gold) 55%, var(--gold-light) 75%, var(--gold-deep) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 8s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }

.container { max-width: var(--max); margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }
.container--narrow { max-width: 880px; }
main { position: relative; z-index: 1; }

/* ── ATMOSPHERE ─────────────────────────────────── */
.atmosphere { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 40%, var(--bg-0) 80%);
}
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(229,193,88,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(229,193,88,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 0%, var(--bg-0) 95%);
  z-index: 3;
}
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; will-change: transform; }
.orb--a { width: 800px; height: 800px; top: -200px; left: -200px; animation: drift1 28s ease-in-out infinite; }
.orb--b { width: 700px; height: 700px; top: 30%; right: -250px; animation: drift2 32s ease-in-out infinite; }
.orb--c { width: 600px; height: 600px; bottom: -150px; left: 30%; opacity: 0.4; animation: drift3 36s ease-in-out infinite; }
.orb--d { width: 500px; height: 500px; top: 60%; left: 10%; opacity: 0.35; animation: drift1 40s ease-in-out infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,80px) scale(1.1); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-100px,120px) scale(0.9); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-80px,-100px); } }
.grain {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.7'/></svg>");
  opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
}

/* ── GLASS BASE ─────────────────────────────────── */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  border-radius: 24px;
  position: relative;
}
.nav {
  background: linear-gradient(
    180deg,
    rgba(127, 2, 137, 0.92) 0%,
    rgba(42, 0, 64, 0.90) 100%
  ) !important;
  border: 0.5px solid rgba(229, 193, 88, 0.40) !important;
  backdrop-filter: blur(24px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
  box-shadow:
    inset 0 0.5px 0 rgba(255,255,255,0.20),
    inset 0 -1px 0 rgba(0,0,0,0.25),
    0 8px 28px rgba(20,4,32,0.30),
    0 2px 6px rgba(0,0,0,0.18) !important;
}
.brand-name { color: #ffffff; }
.glass--strong {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -1px 0 rgba(0,0,0,0.2),
    0 30px 80px -30px rgba(0,0,0,0.6);
}
.glass--strong::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(229,193,88,0.22), transparent 30%, transparent 70%, rgba(229,193,88,0.10));
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: xor; -webkit-mask-composite: xor;
  padding: 1px;
  opacity: 0.6;
}
.glass--soft {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
}

/* ── NAV ─────────────────────────────────────────── */
.nav-wrap { position: fixed; top: 24px; left: 0; right: 0; z-index: 100; padding: 0 32px; transition: top 0.3s ease; }
.nav-wrap.is-scrolled { top: 12px; }
.nav {
  max-width: 1320px; margin: 0 auto;
  display: flex; align-items: center; gap: 32px;
  padding: 12px 12px 12px 24px; border-radius: 100px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { display: flex; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name { font-family: var(--display-font); font-size: 22px; letter-spacing: 0.02em; color: var(--ink); }
.brand-sub { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); margin-top: 4px; }

.nav-links { list-style: none; display: flex; gap: 4px; flex: 1; justify-content: center; }
.nav-links a {
  position: relative; padding: 8px 14px; font-size: 13px; letter-spacing: 0.04em;
  color: rgba(245, 214, 118, 0.85); font-weight: 500; border-radius: 100px; transition: color .25s, background .25s;
}
.nav-links a:hover { color: var(--gold-light); background: rgba(229,193,88,0.10); }
.nav-links a.active { color: var(--gold-light); font-weight: 600; }
.nav-underline {
  position: absolute; left: 14px; right: 14px; bottom: 4px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.nav-cta { padding: 10px 20px; font-size: 13px; }
.nav-burger { display: none; background: none; border: none; flex-direction: column; gap: 5px; padding: 10px; }
.nav-burger span { width: 22px; height: 1.5px; background: var(--gold-light); border-radius: 2px; }
.mobile-menu { display: none; }

/* ── BUTTONS ────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 26px; border-radius: 100px;
  font-size: 14px; letter-spacing: 0.04em; font-weight: 500;
  transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  position: relative; overflow: hidden;
}
.btn:hover { transform: translateY(-1px); }
.btn--gold {
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-deep));
  color: #1a0a2e;
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    inset 0 -2px 4px rgba(0,0,0,0.18),
    0 4px 12px rgba(20,4,32,0.10);
}
.btn--gold:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -2px 4px rgba(0,0,0,0.2), 0 8px 18px rgba(20,4,32,0.14); }
.btn--gold::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.5) 50%, transparent 65%);
  transform: translateX(-100%); transition: transform .8s;
}
.btn--gold:hover::after { transform: translateX(100%); }
.btn--glass {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(229,193,88,0.35);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--gold-light);
}
.btn--glass:hover { background: rgba(229,193,88,0.08); border-color: var(--gold); }
.btn--full { width: 100%; justify-content: center; }

/* ── COMMON ─────────────────────────────────────── */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 11px; letter-spacing: 0.4em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 28px;
}
.eyebrow-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}
.gold-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  margin: 32px 0;
}
.center { text-align: center; }
.center-flex { justify-content: center; }
.mt-48 { margin-top: 48px; }
.muted { color: var(--ink-mute); }
.small { font-size: 12px; }
.gold { color: var(--gold-light); }

.section { padding: 60px 0; position: relative; }
.section-head { margin-bottom: 56px; }
.section-head.center { text-align: center; }
.section-head.center .eyebrow { justify-content: center; }
.section-title { font-size: clamp(36px, 5vw, 64px); line-height: 1.05; font-weight: 300; letter-spacing: -0.02em; color: var(--ink); }
.section-sub { font-size: 18px; line-height: 1.6; color: var(--ink-soft); margin-top: 20px; max-width: 640px; }
.section-head.center .section-sub { margin-left: auto; margin-right: auto; }

/* ── HERO ───────────────────────────────────────── */
.hero-video-wrap { position: relative; overflow: hidden; }
.hero-bg-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}
.hero-video-overlay {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(12,4,24,0.62) 0%, rgba(12,4,24,0.42) 25%, rgba(12,4,24,0.18) 55%, transparent 75%),
    linear-gradient(180deg, transparent 70%, rgba(12,4,24,0.45) 100%);
}
.hero {
  padding: 130px 32px 50px; max-width: var(--max); margin: 0 auto;
  position: relative; z-index: 2; min-height: auto;
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items: center;
}
.hero-inner { max-width: 720px; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 18px; border-radius: 100px;
  font-size: 12px; letter-spacing: 0.08em; color: var(--purple);
  margin-bottom: 32px;
  background: #ffffff !important;
  border: 1px solid rgba(127,2,137,0.18) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: 0 4px 14px rgba(20,4,32,0.18) !important;
  font-weight: 500;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: pulse 2s ease-in-out infinite; }
.pill-label { color: var(--gold-light); font-weight: 600; letter-spacing: 0.15em; }
.pill-sep { color: var(--ink-mute); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.3); } }

.hero-title { font-size: clamp(44px, 6.5vw, 84px); line-height: 1.02; font-weight: 200; letter-spacing: -0.03em; color: var(--ink); text-shadow: 0 2px 18px rgba(20,4,32,0.55), 0 1px 3px rgba(20,4,32,0.40); }
.hero-title .serif { display: inline-block; font-weight: 500; font-style: italic; }
.hero-title .gold-shimmer {
  background: none;
  color: var(--gold);
  -webkit-text-fill-color: var(--gold);
  -webkit-background-clip: initial;
  background-clip: initial;
  animation: none;
  filter: none;
}
.hero-sub { font-size: 18px; line-height: 1.7; color: #ffffff; margin-top: 32px; max-width: 560px; text-shadow: 0 2px 14px rgba(20,4,32,0.65), 0 1px 4px rgba(20,4,32,0.50); }
.hero-pill { text-shadow: 0 1px 6px rgba(20,4,32,0.45); }
.stat-num { text-shadow: 0 2px 14px rgba(20,4,32,0.55); }
.stat-label { text-shadow: 0 1px 6px rgba(20,4,32,0.50); }

.hero-ctas { display: flex; gap: 16px; margin-top: 40px; flex-wrap: wrap; }
.hero-ctas.center-flex { justify-content: center; }

.hero-stats { display: flex; align-items: center; gap: 32px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.stat-num { font-size: 38px; color: var(--ink); }
.stat-num .pct { font-size: 24px; color: var(--gold); }
.stat-label { font-size: 11px; color: #ffffff; letter-spacing: 0.1em; margin-top: 8px; line-height: 1.4; text-shadow: 0 1px 8px rgba(20,4,32,0.55); }
.stat-sep { width: 1px; height: 50px; background: var(--line); }

/* Hero floating cards */
.hero-card-frame { position: relative; height: 600px; }
.floating-card { position: absolute; padding: 24px; border-radius: 24px; min-width: 220px; }
.fc-1 { top: 20px; right: 0; width: 320px; animation: float 6s ease-in-out infinite; }
.fc-2 { top: 220px; left: -20px; width: 240px; animation: float 7s ease-in-out infinite 1s; }
.fc-3 { bottom: 30px; right: 40px; width: 260px; animation: float 8s ease-in-out infinite 0.5s; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.fc-row { display: flex; align-items: center; gap: 8px; }
.fc-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
.fc-label { font-size: 11px; letter-spacing: 0.15em; color: #4ade80; text-transform: uppercase; }
.fc-title { font-size: 18px; font-weight: 500; margin-top: 12px; color: var(--ink); }
.fc-meta { font-size: 12px; color: var(--ink-mute); margin-top: 4px; }
.fc-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 18px; overflow: hidden; }
.fc-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-light)); border-radius: 4px; }
.fc-bar-meta { display: flex; justify-content: space-between; font-size: 11px; margin-top: 8px; color: var(--ink-mute); letter-spacing: 0.05em; }
.fc-bar-meta span:last-child { color: var(--gold-light); }
.fc-tiny { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-mute); text-transform: uppercase; }
.fc-big { font-size: 32px; color: var(--ink); margin-top: 8px; line-height: 1; }
.fc-trend { font-size: 12px; color: #4ade80; margin-top: 8px; }
.fc-trend.gold { color: var(--gold-light); }
/* Gold liquid glass offering card */
.fc-gold-card {
  background: linear-gradient(135deg, rgba(245,214,118,0.42) 0%, rgba(229,193,88,0.28) 50%, rgba(184,146,58,0.20) 100%);
  border: 1px solid rgba(245,214,118,0.70);
  box-shadow: 0 6px 18px rgba(20,4,32,0.18), 0 2px 4px rgba(20,4,32,0.10), inset 0 1px 0 rgba(255,255,255,0.60), inset 0 -1px 0 rgba(255,255,255,0.20);
  backdrop-filter: blur(40px) saturate(200%) brightness(1.08);
  -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.08);
}
.fc-gold-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
.fc-gold-label { font-size: 11px; letter-spacing: 0.15em; color: #4ade80; text-transform: uppercase; font-weight: 600; }
.fc-gold-name { font-size: 20px; font-weight: 600; margin-top: 12px; color: #ffffff; line-height: 1.2; font-family: var(--display-font); }
.fc-gold-loc { font-size: 12px; color: rgba(255,255,255,0.70); margin-top: 4px; }
.fc-gold-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.fc-gold-stat { background: rgba(255,255,255,0.18); border-radius: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.30); }
.fc-gold-stat-val { font-size: 22px; font-weight: 700; color: #ffffff; font-family: var(--display-font); line-height: 1; }
.fc-gold-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.70); letter-spacing: 0.05em; margin-top: 4px; line-height: 1.3; }
.fc-gold-cta { display: block; margin-top: 16px; text-align: center; padding: 9px; background: rgba(127,2,137,0.85); border-radius: 100px; font-size: 12px; font-weight: 600; color: #f5d676; letter-spacing: 0.06em; text-decoration: none; transition: background 0.2s; }
.fc-gold-cta:hover { background: rgba(176,3,190,0.95); }
/* Offering nav link */
.nav-offering-link {
  padding: 6px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  background: linear-gradient(135deg, rgba(245,214,118,0.22), rgba(229,193,88,0.14));
  border: 1px solid rgba(229,193,88,0.45);
  border-radius: 100px; color: var(--gold-light) !important;
  transition: background 0.2s, border-color 0.2s;
}
.nav-offering-link:hover { background: linear-gradient(135deg, rgba(245,214,118,0.35), rgba(229,193,88,0.25)) !important; border-color: rgba(229,193,88,0.70) !important; }

/* ── MARQUEE ─────────────────────────────────────── */
.marquee {
  overflow: hidden; padding: 28px 0;
  border-top: 1px solid rgba(184,146,58,0.25); border-bottom: 1px solid rgba(184,146,58,0.25);
  background: #ffffff; position: relative; z-index: 2;
}
.marquee-track {
  display: flex; gap: 60px; white-space: nowrap; animation: scroll 30s linear infinite;
  mask: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  -webkit-mask: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
}
.marquee-item { font-family: var(--display-font); font-size: 28px; font-style: italic; color: var(--gold-deep); letter-spacing: 0.05em; }
.marquee-item em { color: var(--purple); font-style: normal; margin: 0 12px; }
@keyframes scroll { to { transform: translateX(-50%); } }

/* ── PROMISE GRID ────────────────────────────────── */
.promise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.promise-copy .lede { font-size: 22px; line-height: 1.5; color: var(--ink); margin-bottom: 20px; font-weight: 300; }
.promise-copy p { color: var(--ink-soft); line-height: 1.7; margin-bottom: 16px; }
.promise-visual { position: relative; }
.image-stack { position: relative; aspect-ratio: 1/1; }
.image-card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; padding: 12px; }
.image-card img, .image-card video { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
.image-badge {
  position: absolute; bottom: -30px; right: -30px;
  padding: 24px 32px; border-radius: 20px; z-index: 2;
  min-width: 220px; text-align: left;
}
.ib-tiny { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-mute); text-transform: uppercase; }
.ib-big { font-size: 42px; color: var(--gold-light); margin-top: 6px; line-height: 1; }
.ib-mini { font-size: 11px; color: var(--ink-soft); margin-top: 6px; letter-spacing: 0.05em; }
.image-orb-1 { display: none; }
.image-orb-2 { display: none; }

/* ── VALUES ─────────────────────────────────────── */
.section--light,
.section--warm,
.section--white {
  background: #ffffff;
  position: relative;
  z-index: 2;
}
.section--light .eyebrow,
.section--warm .eyebrow,
.section--white .eyebrow { color: var(--gold-deep); }
.section--light .eyebrow-dot,
.section--warm .eyebrow-dot,
.section--white .eyebrow-dot { background: var(--gold-deep); box-shadow: 0 0 8px var(--gold-deep); }
.section--light .section-title,
.section--warm .section-title,
.section--white .section-title { color: #1a001f; }
.section--light .section-sub,
.section--warm .section-sub,
.section--white .section-sub { color: #4a3450; }
.section--light .gold-divider,
.section--warm .gold-divider,
.section--white .gold-divider { background: linear-gradient(90deg, transparent, var(--gold-deep) 50%, transparent); }
.section--light .gold-shimmer,
.section--warm .gold-shimmer,
.section--white .gold-shimmer {
  background: linear-gradient(110deg, var(--gold-deep) 0%, var(--gold) 35%, var(--gold-deep) 55%, var(--gold) 75%, var(--gold-deep) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.section--light .lede,
.section--warm .lede,
.section--white .lede { color: #1a001f; }
.section--light .promise-copy p,
.section--warm .promise-copy p,
.section--white .promise-copy p,

/* Card-themed buttons inherit the contrasting accent */
.card-gold .btn--glass {
  background: rgba(127,2,137,0.10) !important;
  border: 1px solid rgba(127,2,137,0.40) !important;
  color: #6b0273 !important;
}

  background: linear-gradient(135deg, #7f0289, #B003BE) !important;
  color: var(--gold-light) !important;
  border-color: rgba(245,214,118,0.5) !important;
}
.card-gold .btn--gold::after { display: none; }
.values-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.value-card {
  padding: 36px 28px; border-radius: 24px; text-align: center; position: relative; transition: transform .4s, box-shadow .4s;
  background: linear-gradient(145deg, #B003BE 0%, #7f0289 100%);

}
.value-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(20,4,32,0.15), 0 4px 8px rgba(20,4,32,0.08); }
.value-roman { position: absolute; top: 16px; right: 20px; font-size: 14px; color: var(--gold-light); opacity: 0.7; letter-spacing: 0.1em; }
.value-icon { display: flex; justify-content: center; margin-bottom: 20px; }
.value-name { font-size: 20px; font-weight: 500; color: #ffffff; margin-bottom: 10px; }
.value-desc { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.75); }

/* ── BANNER ─────────────────────────────────────── */
.banner-glass { padding: 80px 60px; border-radius: 32px; text-align: center; position: relative; overflow: hidden; }
.banner-glow {
  position: absolute; inset: -50%; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(229,193,88,0.15), transparent 50%);
}
.banner-inner { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
.banner-inner .eyebrow { justify-content: center; display: inline-flex; }
.banner-inner .section-title { margin-bottom: 0; }
.banner-inner .section-sub { margin-left: auto; margin-right: auto; }
.banner-inner .hero-ctas { justify-content: center; }

/* ── REASONS ────────────────────────────────────── */
.reasons-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.reason-card {
  border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; transition: transform .4s, box-shadow .4s; animation: float 6s ease-in-out infinite;
  background: linear-gradient(145deg, #B003BE 0%, #7f0289 100%);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 6px 18px rgba(20,4,32,0.10), 0 2px 4px rgba(20,4,32,0.06);
}
.reason-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(20,4,32,0.15), 0 4px 8px rgba(20,4,32,0.08); }
.reason-img { position: relative; height: 260px; overflow: hidden; }
.reason-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; transition: transform .8s; }
.reason-card:hover .reason-img img { transform: scale(1.06); }
.reason-img-overlay { display: none; }
.reason-body { padding: 28px; flex: 1; }
.reason-index { color: var(--gold-light); font-size: 14px; letter-spacing: 0.1em; }
.reason-title { font-size: 22px; font-weight: 500; margin: 8px 0 12px; color: #ffffff; }
.reason-desc { color: rgba(255,255,255,0.75); line-height: 1.6; font-size: 14px; }

/* ── DEAL BANNER ────────────────────────────────── */
.deal-banner { padding: 60px; border-radius: 32px; position: relative; overflow: hidden; }
.deal-orbs { display: none; }
.deal-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 60px; align-items: center; }
.deal-badge { display: inline-block; padding: 6px 14px; border: 1px solid var(--gold); color: var(--gold-light); font-size: 10px; letter-spacing: 0.3em; border-radius: 100px; }
.deal-title { font-size: 36px; line-height: 1.1; margin-top: 16px; color: var(--ink); }
.deal-sub { color: var(--ink-soft); margin-top: 12px; }
.deal-right { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.deal-right .btn { grid-column: span 2; justify-self: start; }
.deal-stat { display: flex; gap: 12px; align-items: flex-start; }
.deal-check { color: var(--gold); font-size: 18px; }
.deal-stat-big { font-size: 28px; color: var(--ink); line-height: 1; }
.deal-stat-label { font-size: 11px; color: var(--ink-mute); margin-top: 6px; letter-spacing: 0.05em; }

/* ── CHOOSE ─────────────────────────────────────── */
.choose-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.choose-card { padding: 36px 28px 28px; border-radius: 24px; transition: transform .4s; }
.choose-card:hover { transform: translateY(-6px); }
.choose-num { font-size: 36px; color: var(--gold); opacity: 0.5; letter-spacing: 0.05em; }
.choose-title { font-size: 18px; font-weight: 500; color: var(--ink); margin-top: 16px; margin-bottom: 12px; }
.choose-desc { color: var(--ink-soft); line-height: 1.6; font-size: 14px; }
.choose-ornament { margin-top: 24px; opacity: 0.5; }

/* ── BOOK CALL ──────────────────────────────────── */
.book-call { padding: 48px; border-radius: 32px; display: grid; grid-template-columns: 1fr 1.8fr; gap: 40px; align-items: center; }
.calendar-mock { padding: 24px; border-radius: 20px; }
.book-call .meetings-iframe-container { width: 100%; min-height: 680px; border-radius: 16px; overflow: hidden; }
.book-call .meetings-iframe-container iframe { width: 100% !important; min-height: 680px !important; border: 0 !important; }
@media (max-width: 980px) {
  .book-call { grid-template-columns: 1fr; gap: 28px; padding: 36px 24px; }
  .book-call .meetings-iframe-container { min-height: 720px; }
  .book-call .meetings-iframe-container iframe { min-height: 720px !important; }
}
.cm-head { display: flex; justify-content: space-between; align-items: center; color: var(--gold-light); font-size: 12px; letter-spacing: 0.2em; margin-bottom: 20px; }
.cm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cm-day-label { font-size: 10px; color: var(--ink-mute); text-align: center; padding: 6px 0; letter-spacing: 0.1em; }
.cm-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-soft); border-radius: 8px; transition: all .25s; }
.cm-day.available { color: var(--gold-light); border: 1px solid rgba(229,193,88,0.3); cursor: pointer; }
.cm-day.available:hover { background: rgba(229,193,88,0.1); }
.cm-day.selected { background: linear-gradient(135deg, var(--gold-light), var(--gold-deep)); color: #1a0a2e; border: none; font-weight: 600; }
.cm-slots { display: flex; gap: 8px; margin-top: 20px; }
.cm-slot { flex: 1; padding: 10px; text-align: center; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--ink-soft); cursor: pointer; }
.cm-slot.active { background: rgba(229,193,88,0.12); border-color: var(--gold); color: var(--gold-light); }

/* ── PAGE HERO ──────────────────────────────────── */
.page-hero { padding: 120px 0 20px; position: relative; z-index: 2; background: #ffffff; }
.page-hero .container { max-width: var(--max); margin: 0 auto; padding: 0 32px; }
.page-hero + .section { padding-top: 24px; }
.page-hero-title { font-size: clamp(32px, 4.5vw, 60px); line-height: 1.05; font-weight: 300; color: #1a001f; letter-spacing: -0.03em; }
.page-hero-title .serif { font-style: italic; font-weight: 500; }
.page-hero-sub { font-size: 16px; color: #4a3450; max-width: 580px; margin-top: 16px; line-height: 1.65; }
.page-hero .eyebrow { color: var(--gold-deep); }
.page-hero .eyebrow-dot { background: var(--gold-deep); box-shadow: 0 0 8px var(--gold-deep); }
.page-hero .gold-divider { background: linear-gradient(90deg, transparent, var(--gold-deep) 50%, transparent); }
.page-hero .gold-shimmer {
  background: linear-gradient(110deg, var(--gold-deep) 0%, var(--gold) 35%, var(--gold-deep) 55%, var(--gold) 75%, var(--gold-deep) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

/* ── ABOUT ──────────────────────────────────────── */
.about-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center; }
.about-copy { padding: 48px; border-radius: 28px; }
.about-mission { font-size: 24px; line-height: 1.4; color: var(--gold-light); font-style: italic; }
.about-copy p { color: var(--ink-soft); line-height: 1.7; margin-bottom: 16px; }
.about-visual { position: relative; aspect-ratio: 4/5; }
.about-visual .image-card { position: absolute; inset: 0; }
.about-visual .image-badge { bottom: -30px; left: -30px; right: auto; }

.mission-banner { padding: 80px; border-radius: 32px; text-align: center; }
.mission-banner .eyebrow { justify-content: center; display: inline-flex; }
.mission-banner .section-title { max-width: 900px; margin: 0 auto; font-size: clamp(28px, 3.5vw, 44px); line-height: 1.3; font-weight: 300; }
.mission-banner .hero-ctas { margin-top: 40px; justify-content: center; }

/* ── PORTFOLIO ──────────────────────────────────── */
.portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
.property-card { border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; transition: transform .4s, box-shadow .4s; }
.property-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.property-img { position: relative; height: 280px; overflow: hidden; }
.property-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s; }
.property-card:hover .property-img img { transform: scale(1.04); }
.property-details { margin: 12px 0 20px; display: flex; flex-direction: column; gap: 6px; }
.property-detail-row { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
.pd-key { color: var(--ink-soft); }
.pd-val { color: var(--ink); font-weight: 500; }
.property-status {
  position: absolute; top: 16px; left: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 100px; font-size: 10px; letter-spacing: 0.2em;
  background: rgba(12,4,24,0.7); backdrop-filter: blur(10px); color: var(--ink);
  border: 1px solid var(--glass-border);
}
.ps-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-light); }
.property-status.closed .ps-dot { background: #94a3b8; }
.property-status.underwriting .ps-dot { background: #fbbf24; }
.property-status.coming-soon .ps-dot { background: #4ade80; }
.property-body { padding: 28px; flex: 1; display: flex; flex-direction: column; }
.property-loc { font-size: 11px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
.property-name { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--ink); letter-spacing: 0.04em; text-transform: uppercase; }
.property-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ps-val { font-size: 20px; color: var(--gold-light); line-height: 1; }
.ps-key { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.1em; margin-top: 6px; text-transform: uppercase; }

.track-record {
  padding: 60px; border-radius: 32px; text-align: center;
  background: #fdf8f5 !important;
  border: 1px solid rgba(176,3,190,0.10) !important;
  backdrop-filter: none !important;
  box-shadow: 0 6px 18px rgba(20,4,32,0.08) !important;
}
.track-record .eyebrow { justify-content: center; display: inline-flex; color: var(--gold-deep); }
.track-record .eyebrow-dot { background: var(--gold-deep); box-shadow: 0 0 8px var(--gold-deep); }
.tr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 40px; }
.tr-big { font-size: 56px; line-height: 1; }
.tr-label { font-size: 13px; color: #5a4060; margin-top: 12px; letter-spacing: 0.05em; }

/* ── HOW ────────────────────────────────────────── */
.steps { position: relative; max-width: 900px; margin: 0 auto; }
.steps-rail {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, var(--gold) 10%, var(--gold) 90%, transparent);
  opacity: 0.3;
}
.step { display: grid; grid-template-columns: 100px 1fr; gap: 32px; padding: 32px; border-radius: 24px; margin-bottom: 32px; position: relative; align-items: center; width: 75%; }
.step.left { margin-left: 0; }
.step.right { margin-left: auto; }
.step-num { font-size: 48px; color: var(--gold); line-height: 1; }
.step-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 16px var(--gold); margin-top: 12px; }
.step-title { font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
.step-desc { color: var(--ink-soft); line-height: 1.6; }

/* ── EDUCATION ──────────────────────────────────── */
.ebook { padding: 60px; border-radius: 32px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 60px; align-items: center; }
.ebook-cover { aspect-ratio: 3/4; padding: 32px; border-radius: 8px; position: relative; background: linear-gradient(135deg, var(--bg-2), var(--bg-1)); overflow: hidden; box-shadow: 30px 30px 80px rgba(0,0,0,0.5); transform: rotate(-3deg); }
.eb-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, rgba(0,0,0,0.4), transparent); }
.eb-front { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.eb-tiny { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); }
.eb-title { font-size: 36px; line-height: 1.1; color: var(--gold-light); }
.eb-author { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.1em; }
.eb-emblem { position: absolute; bottom: 20px; right: 0; opacity: 0.7; }
.inline-form { display: flex; gap: 8px; margin-top: 28px; padding: 6px; border-radius: 100px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); max-width: 480px; }
.inline-form input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); padding: 0 20px; font-size: 14px; font-family: inherit; }
.inline-form input::placeholder { color: var(--ink-mute); }

.library-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.article-card { padding: 32px; border-radius: 20px; transition: transform .4s; cursor: pointer; }
.article-card:hover { transform: translateY(-4px); }
.article-tag { display: inline-block; padding: 4px 12px; border: 1px solid rgba(229,193,88,0.3); border-radius: 100px; font-size: 10px; letter-spacing: 0.2em; color: var(--gold-light); text-transform: uppercase; }
.article-title { font-size: 20px; font-weight: 500; margin: 16px 0 12px; color: var(--ink); line-height: 1.3; }
.article-desc { color: var(--ink-soft); line-height: 1.6; font-size: 14px; }
.article-foot { display: flex; justify-content: space-between; margin-top: 24px; font-size: 12px; color: var(--ink-mute); letter-spacing: 0.05em; }

/* ── FOUNDER ────────────────────────────────────── */

  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd">
          <b>{title}</b>
          <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, label, children }) {
  return (
    <>
      <div className="twk-sect">{title || label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row" style={{flexDirection:'row',alignItems:'center',justifyContent:'space-between',gap:10}}>
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    window.addEventListener("scroll", onScroll);

  }, []);

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Read initial page from hash so back/forward works on reload too
  const getInitialPage = () => {
    const h = window.location.hash.replace("#", "");
    return h || "home";
  };
  const [page, setPageState] = useState(getInitialPage);

  // Wrap setPage so every navigation creates a real browser history entry
  const setPage = (newPage) => {
    setPageState(newPage);
    const hash = newPage === "home" ? "" : "#" + newPage;
    history.pushState({ page: newPage }, "", window.location.pathname + hash);
  };

  // Handle browser back / forward
  useEffect(() => {
    // Seed the initial history entry so the very first back-press doesn't leave the SPA
    history.replaceState({ page: page }, "", window.location.pathname + (page === "home" ? "" : "#" + page));

    const onPop = (e) => {
      const p = (e.state && e.state.page) ? e.state.page : "home";
      setPageState(p);
      window.scrollTo({ top: 0 });
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const palette = PALETTES[tweaks.palette] || PALETTES.amethyst;

  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--bg-0", palette.bg0);
    r.style.setProperty("--bg-1", palette.bg1);
    r.style.setProperty("--bg-2", palette.bg2);
    r.style.setProperty("--purple", palette.purple);
    r.style.setProperty("--deep", palette.deep);
    r.style.setProperty("--gold", palette.gold);
    r.style.setProperty("--gold-deep", palette.goldDeep);
    r.style.setProperty("--gold-light", palette.goldLight);
    r.style.setProperty("--glass-blur", `${tweaks.glassIntensity}px`);
    r.style.setProperty("--display-font", `'${tweaks.displayFont}', 'Cormorant Garamond', serif`);
  }, [palette, tweaks.glassIntensity, tweaks.displayFont]);

  const svgDefs = (
    <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
      <defs>
        <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="var(--gold-light)" />
          <stop offset="50%" stopColor="var(--gold)" />
          <stop offset="100%" stopColor="var(--gold-deep)" />
        </linearGradient>
      </defs>
    </svg>
  );

  let body;
  switch (page) {
    case "about": body = <AboutPage setPage={setPage}/>; break;
    case "portfolio": body = <PortfolioPage setPage={setPage}/>; break;
    case "how": body = <HowPage setPage={setPage}/>; break;
    case "education": body = <EducationPage setPage={setPage}/>; break;
    case "ira": body = <IRAPage setPage={setPage}/>; break;
    case "book": body = <BookCallPage setPage={setPage}/>; break;
    case "faq": body = <FAQPage/>; break;
    case "contact": body = <ContactPage/>; break;
    case "login": body = <LoginPage/>; break;
    default: body = <HomePage setPage={setPage}/>;
  }

  return (
    <>
      {svgDefs}
      <Atmosphere palette={palette} showOrbs={tweaks.showOrbs} showGrain={tweaks.showGrain}/>
      <Nav page={page} setPage={setPage}/>
      <main>{body}</main>
      <Footer setPage={setPage} page={page}/>
      <MyTweaks tweaks={tweaks} setTweak={setTweak}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
